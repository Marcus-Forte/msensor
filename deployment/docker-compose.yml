services:

  # 1. The PTP Grandmaster Clock Service (Time sync with sensors)
  ptp-master:
    build:
      context: .
      dockerfile_inline: |
        FROM debian:trixie-slim
        RUN apt-get update && \
            apt-get install -y --no-install-recommends ptpd && \
            rm -rf /var/lib/apt/lists/*
        CMD ["ptpd", "-M", "-i", "eth0", "-C"]
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_TIME
    restart: always

  msensor:
    image: mdnf1992/msensor
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    init: true
    restart: unless-stopped
    privileged: true
    network_mode: host
    command: ["sensor_publisher", "/config/publisher_config.json"]
    
    ports:
      - "50051:50051"
    volumes:
      - "./config/:/config"
      - "/dev:/dev"
      - "/run/udev:/run/udev"
