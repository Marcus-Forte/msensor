name: C++ CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with: 
        submodules: true

    - name: Pull Docker image
      run: docker pull --platform linux/arm64 mdnf1992/cpp-dev

    - name: Build application & Test
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace mdnf1992/cpp-dev /bin/bash -c "cmake --preset gcc && cmake --build --preset build-gcc && ctest --preset test-gcc --output-junit test-results.xml"

    - name: Test Report
      uses: mikepenz/action-junit-report@v5
      if: success() || failure()
      with:
        report_paths: ${{ github.workspace }}/build/gcc/test-results.xml