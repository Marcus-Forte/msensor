syntax = "proto3";

import "header.proto";

package sensors;

message PointCloud3 { 
    Header header = 1;
    repeated float x = 2 [packed=true];
    repeated float y = 3 [packed=true];
    repeated float z = 4 [packed=true];

    repeated uint32 intensity = 5 [packed=true];

    // Optional color information
    repeated float r = 6 [packed=true];
    repeated float g = 7 [packed=true];
    repeated float b = 8 [packed=true];

}

message LidarStreamRequest {
    // Same contract as ImuStreamRequest.max_queued_samples; see the server's
    // per-stream default and cap in grpc/sensor_stream.hh.
    uint32 max_queued_samples = 1;
}

service LidarService {
    rpc getLidarScan(LidarStreamRequest) returns (stream PointCloud3);
}
