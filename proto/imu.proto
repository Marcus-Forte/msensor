syntax = "proto3";

import "header.proto";

package sensors;

message IMUData {
    Header header = 1;
    float ax = 2;
    float ay = 3;
    float az = 4;
    float gx = 5;
    float gy = 6;
    float gz = 7;
}

message ImuStreamRequest {
}

service ImuService {
    rpc getImuData(ImuStreamRequest) returns (stream IMUData);
}
