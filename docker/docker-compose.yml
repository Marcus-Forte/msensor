services:

  msensor:
    image: mdnf1992/msensor
    init: true
    restart: unless-stopped
    pull_policy: always
    privileged: true
    network_mode: host
    command: ["sensor_publisher", "/cfg/publisher_config.json"]
    profiles: ["robot"]
    ports:
      - "50051:50051"
    volumes:
      - "./cfg:/cfg"
      - "/dev:/dev"
      - "/run/udev:/run/udev"
